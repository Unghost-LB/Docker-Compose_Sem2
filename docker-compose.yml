services: 
  app:
    container_name: api1-Docker
    build: ./api/hello-world-api
    ports:
    - "3000:3000"
    environment:
    - MESSAGE=${MESSAGE1}

  app2:
    container_name: api2-Docker
    build: ./api/hello-world-api
    ports:
    - "3001:3000"
    environment:
    - MESSAGE=${MESSAGE2}

  app3:
    container_name: api3-Docker
    build: ./api/hello-world-api
    ports:
    - "3002:3000"
    environment:
    - MESSAGE=${MESSAGE3}

  db:
    image: postgres
    container_name: blue_wonderful
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_USER: ${USER_Postgres}
      POSTGRES_PASSWORD: ${PASSWORD_Postgres}
      POSTGRES_DB: ${DB_Postgres}
    ports:
      - 5432:5432